<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Success - Cinema World</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:#f2f2f2;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

.success-box{
    width:400px;
    background:white;
    padding:30px;
    text-align:center;
    border-radius:10px;

    box-shadow:0 0 10px rgba(0,0,0,0.3);
}

h1{
    color:green;
}

h2{
    margin-bottom:15px;
}

p{
    font-size:18px;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:10px 25px;

    background:green;
    color:white;

    text-decoration:none;
    border-radius:5px;
}

.btn:hover{
    background:darkgreen;
}

</style>

</head>

<body>

<div class="success-box">

<h1>Welcome to Amazon</h1>

<h2 id="name"></h2>

<p>Your form is submitted successfully.</p>

<a href="index.html" class="btn">
    Go to Home
</a>

</div>


<script>

var username =
localStorage.getItem("username");

document.getElementById("name").innerHTML =
username;

</script>

</body>

</html>
